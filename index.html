<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supabase Auth Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authPanel">
        <div class="login-card">
            <div class="illustration">
                <div class="profile-icon">👤</div>
            </div>

            <div class="form-container">
                <h1 id="formTitle">User Login</h1>
                
                <!-- Login Form -->
                <form id="loginForm">
                    <div class="input-group">
                        <input id="loginEmail" type="email" placeholder="Email id" required>
                    </div>
                    <div class="input-group">
                        <input id="loginPassword" type="password" placeholder="Password" required>
                    </div>
                    <button type="button" id="loginBtn">Login</button>
                    <a href="#" id="forgotPassword" class="forgot-link">Forgot Username / Password?</a>
                </form>

                <hr style="margin: 20px 0; border: 0.5px solid #eee;">

                <!-- Signup Form (Simplified for this UI) -->
                <h3 id="signupTitle">New here? Create an account</h3>
                <form id="signupForm">
                    <input id="signupName" type="text" placeholder="Display Name" style="margin-bottom:10px;">
                    <input id="signupEmail" type="email" placeholder="Email id" style="margin-bottom:10px;" required>
                    <input id="signupPassword" type="password" placeholder="Password" style="margin-bottom:10px;" required>
                    <button type="button" id="signupBtn" style="background-color: #2196F3;">Sign Up</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard">
        <video class="background" autoplay muted loop playsinline preload="auto" poster="Dashboard/images/background.jpg">
            <source src="Dashboard/images/background.mp4" type="video/mp4">
        </video>
        <h2 class="name">Mason Andrade</h2>
        <p id="welcome" class="welcome"></p>
        <nav class="menu" aria-label="Main navigation">
            <p><i class="fa-solid fa-user"></i><a href="Dashboard/aboutme.html"> About me</a></p>
            <p><i class="fa-solid fa-file-lines"></i> Resume</p>
            <p><i class="fa-solid fa-gamepad"></i><a href="Dashboard/hobby.html"> Hobby</a></p>
            <p><i class="fa-solid fa-briefcase"></i> Work</p>
            <p><i class="fa-solid fa-project-diagram"></i><a href="Dashboard/project.html"> Projects</a></p>
        </nav>
        <button id="logoutBtn" class="logout-button" type="button">Log out</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
