<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Mason's Website</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }
        .background{
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .name {
            position: absolute;
            font-family: Arial, sans-serif;
            color: white;
            top: 30%;
            left: 30%;
            z-index: 1;
            margin: 4px 0;
        }
        .menu {
            position: absolute;
            top: 20%;
            right: 10%;
            z-index: 1;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;

        }
        .menu p {
            display: block;
            margin: 4px 0;
            color: white;
            font-family: Arial, sans-serif;
        }
        a{
            color: white;
            text-decoration: none;
        }
        a:visited{
            color: white;
        }
        @media (max-width: 700px) {
            body {
                overflow-y: auto;
                padding: 0 20px 32px;
            }

            .name {
                position: relative;
                top: auto;
                left: auto;
                margin: 0;
                padding-top: max(18vh, 120px);
                font-size: clamp(1.5rem, 7vw, 2rem);
                text-align: center;
            }

            .menu {
                position: relative;
                top: auto;
                right: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                margin: 32px auto 0;
                padding: 0;
                font-size: clamp(1rem, 5vw, 1.2rem);
            }

            .menu p {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <video class="background" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="./images/background.mp4" type="video/mp4">
    </video>
    <h2 class="name">Mason Andrade</h2>
    <div class="menu">
        <p><i class="fa-solid fa-user"></i><a href="aboutme.html"> About me </a></p>
        <p><i class="fa-solid fa-file-lines"></i> Resume</p>
        <p><i class="fa-solid fa-gamepad"></i><a href="hobby.html">Hobby</a></p>
        <p><i class="fa-solid fa-briefcase"></i> Work</p>
        <p><i class="fa-solid fa-project-diagram"></i><a href="project.html"> Projects</a></p>

    </div>
</body>
</html>
